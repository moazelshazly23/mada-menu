<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم | MADA</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<section id="login" class="login">
  <form id="loginForm" class="login-card" autocomplete="off">
    <img src="assets/logo.png" alt="MADA" class="login-logo" width="450" height="292">
    <h1>لوحة تحكم المنيو</h1>
    <p class="muted">سجّل الدخول بتوكن GitHub الخاص بك. يُحفظ التوكن في هذه الجلسة فقط ويُمسح عند تسجيل الخروج أو إغلاق المتصفح.</p>
    <label class="fld"><span>اسم حساب GitHub (Owner)</span><input id="owner" dir="ltr" required placeholder="username"></label>
    <label class="fld"><span>اسم المستودع (Repository)</span><input id="repo" dir="ltr" required placeholder="mada-menu"></label>
    <label class="fld"><span>GitHub Personal Access Token</span><input id="token" type="password" dir="ltr" required placeholder="github_pat_…" autocomplete="off"></label>
    <p id="loginErr" class="msg err" hidden></p>
    <button class="btn primary block" id="loginBtn" type="submit">تسجيل الدخول</button>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><img src="assets/favicon.png" alt="" width="36" height="36"><strong>لوحة تحكم MADA</strong></div>
    <div class="top-actions">
      <span id="dirtyBadge" class="badge" hidden>تعديلات غير منشورة</span>
      <button class="btn primary" id="publishBtn" data-act="publish" disabled>نشر التعديلات</button>
      <button class="btn ghost" data-act="logout">تسجيل الخروج</button>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view" class="view"></main>
</div>

<div id="modalRoot"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="js/github-api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
